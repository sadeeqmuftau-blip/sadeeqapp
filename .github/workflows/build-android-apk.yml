name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Bundle web assets into Android project
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          rm -rf android/app/src/main/assets/download android/app/src/main/assets/assets/aistudio

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Prepare release APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/CryptoSignalRadar-v1.0.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSignalRadar-v1.0-apk
          path: release-artifacts/CryptoSignalRadar-v1.0.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-latest' }}
          name: CryptoSignalRadar APK (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-latest' }})
          files: release-artifacts/CryptoSignalRadar-v1.0.apk
          generate_release_notes: true
          make_latest: true
